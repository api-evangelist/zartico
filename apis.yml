- aid: zartico:zartico-identity
  name: Zartico Identity (OpenID Connect / OAuth 2.0)
  description: Zartico fronts its platform with Okta-hosted identity, and two of its hosts publish complete,
    anonymously readable discovery documents - login.zartico.com and platform.zartico.com. Each serves
    both OpenID Connect Discovery 1.0 (/.well-known/openid-configuration) and RFC 8414 OAuth 2.0 Authorization
    Server Metadata (/.well-known/oauth-authorization-server), declaring authorization, token, userinfo,
    JWKS, introspection, revocation and dynamic client registration endpoints, RS256 id-token signing,
    PKCE (S256), and the openid, email, profile, address, phone, offline_access and groups scopes. login.zartico.com
    additionally advertises device_code, CIBA and Okta OOB/OTP grant types. These documents are identity
    metadata for the ZDOS applications; they are not a product data API, and no resource-server API reference
    is published against them.
  image: https://go.zartico.com/hubfs/zartico-logo-final_rgb-white-horizontal.png
  humanURL: https://login.zartico.com/
  baseURL: https://login.zartico.com
