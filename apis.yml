aid: zartico
name: Zartico
description: Zartico is a Salt Lake City based destination-intelligence software company, founded in 2019,
  that operates the Zartico Destination Operating System (ZDOS) for destination marketing and management
  organizations, states, airports, attractions and ski resorts. The platform fuses daily geolocation observations,
  credit-card spending data, lodging and short-term-rental data, event demand and DMO digital analytics
  into a single integrated data model, and surfaces it through the Z5 visualization suite, Event Pulse
  and visitor-journey modules. Zartico publishes no general-purpose developer portal or REST API reference;
  its public machine-readable surface is an anonymously readable OGC GeoServer estate (WMS 1.3.0, WFS
  2.0.0, WCS 2.0.1) at geoserver.zartico.com and two Okta-hosted OpenID Connect / OAuth 2.0 authorization
  servers at login.zartico.com and platform.zartico.com. Customer-facing integration is inbound rather
  than outbound - Zartico is granted read access to a destination's Google Analytics, ad server and CRM,
  and deploys a per-client geolocation attribution pixel.
