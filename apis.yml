apis:
- aid: zartico:zartico-geoserver
  name: Zartico GeoServer OGC Web Services
  description: Zartico operates a public, anonymously readable GeoServer instance at geoserver.zartico.com
    serving OGC Web Services over its destination geospatial estate. The WMS 1.3.0 capabilities document
    advertises 34 named layers across two workspaces (zartographer and regions_app) - client boundary
    polygons, client regions, census tracts, county subdivisions, incorporated places, ZCTA boundaries,
    state and county boundaries, synthetic cities and point-of-interest layers - with GetCapabilities,
    GetMap and GetFeatureInfo, eleven output image formats and 7,957 supported CRS codes. The WFS 2.0.0
    capabilities document advertises 27 feature types and eleven operations including Transaction, LockFeature,
    GetPropertyValue and stored queries, with GeoJSON, GML 3.2 and KML output, result paging and a CountDefault
    of 1,000,000. A WCS 2.0.1 endpoint answers GetCapabilities but currently advertises zero coverages.
    The service declares Fees "none" and AccessConstraints "none". This is a self-describing OGC contract,
    not an OpenAPI - the GetCapabilities documents ARE the machine-readable interface.
  image: https://go.zartico.com/hubfs/zartico-logo-final_rgb-white-horizontal.png
  humanURL: https://geoserver.zartico.com/geoserver/index.html
  baseURL: https://geoserver.zartico.com/geoserver/ows
