observations:
  - >-
    No API key, bearer token or personal-access-token issuance is documented anywhere on
    www.zartico.com or support.zartico.com.
  - >-
    https://www.zartico.com/security states that hardware 2-factor authentication is required for
    all Zartico staff and that customer dashboards and portals are password-protected. It
    documents no customer-facing API authentication.
