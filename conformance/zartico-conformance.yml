domain_standards:
  note: >-
    REWARD-ONLY, and honestly empty of a market standard. Destination marketing and tourism
    analytics has no widely adopted contract-level interchange standard comparable to FHIR,
    SCIM or ISO 20022, and Zartico's contract declares none. What it DOES declare is a
    cross-cutting geospatial standard family, recorded above as ogc-wms-1.3.0 / ogc-wfs-2.0.0 /
    ogc-wcs-2.0.1 - the OGC signature IS the domain-standard signal for a location-intelligence
    provider, and it is present, self-declared, and machine-readable.
  declared:
    - standard: OGC Web Services (OWS) Common
      signature: XML root elements in the http://www.opengis.net/{wms,wfs,wcs} namespaces
      evidence: https://geoserver.zartico.com/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities
    - standard: EPSG coordinate reference system registry
      signature: urn:ogc:def:crs:EPSG::4326 as DefaultCRS; 7,957 EPSG codes in the WMS CRS list
      evidence: openapi/zartico-geoserver-wms-capabilities.xml
    - standard: GML 3.2 / GeoJSON feature encoding
      signature: WFS outputFormat values application/gml+xml; version=3.2 and application/json
      evidence: openapi/zartico-geoserver-wfs-capabilities.xml
