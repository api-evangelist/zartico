method: probed
source: >-
  Live anonymous fetches on 2026-09-05 of the GeoServer OWS capabilities documents at
  https://geoserver.zartico.com/geoserver/ows and the OpenID Connect / OAuth 2.0 discovery
  documents at login.zartico.com and platform.zartico.com; plus https://www.zartico.com/security
  and https://www.zartico.com/privacy-promise for stated compliance posture.
note: |
  Zartico's conformance is entirely OGC and OAuth/OIDC. There is no OpenAPI, no JSON:API, no
  RFC 9457 problem+json, no OData and no SCIM anywhere on the estate. The OGC entries below are
  DEFINITIVE rather than inferred: an XML root element of WMS_Capabilities / wfs:WFS_Capabilities /
  wcs:Capabilities in the opengis.net namespace IS the conformance claim, made by the service
  about itself.
conformance:
  - id: ogc-wms-1.3.0
    name: OGC Web Map Service 1.3.0
    conforms: true
    evidence: https://geoserver.zartico.com/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities
    artifact: openapi/zartico-geoserver-wms-capabilities.xml
    detail: >-
      HTTP 200, content-type text/xml, root <WMS_Capabilities version="1.3.0"
      xmlns="http://www.opengis.net/wms">. Advertises GetCapabilities, GetMap and GetFeatureInfo;
      34 named layers; 11 output formats (image/png, image/jpeg, image/gif, image/svg+xml,
      image/geotiff, image/tiff, image/vnd.jpeg-png and 8-bit variants); 7,957 supported CRS
      codes. Fees "none", AccessConstraints "none".
  - id: ogc-wfs-2.0.0
    name: OGC Web Feature Service 2.0.0
    conforms: true
    evidence: https://geoserver.zartico.com/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities
    artifact: openapi/zartico-geoserver-wfs-capabilities.xml
    detail: >-
      HTTP 200, content-type application/xml, root <wfs:WFS_Capabilities version="2.0.0">,
      ows:ServiceType WFS. 27 feature types. Eleven operations - GetCapabilities,
      DescribeFeatureType, GetFeature, GetPropertyValue, GetFeatureWithLock, LockFeature,
      Transaction, ListStoredQueries, DescribeStoredQueries, CreateStoredQuery, DropStoredQuery.
      Declares ImplementsTransactionalWFS TRUE, ImplementsLockingWFS TRUE, ImplementsResultPaging
      TRUE, CountDefault 1000000. Output formats include application/json (GeoJSON),
      application/gml+xml version 3.2 and KML. Default CRS urn:ogc:def:crs:EPSG::4326.
  - id: ogc-wcs-2.0.1
    name: OGC Web Coverage Service 2.0.1
    conforms: true
    evidence: https://geoserver.zartico.com/geoserver/ows?service=WCS&version=2.0.1&request=GetCapabilities
    artifact: openapi/zartico-geoserver-wcs-capabilities.xml
    detail: >-
      HTTP 200, root <wcs:Capabilities>, ows:ServiceType urn:ogc:service:wcs, ServiceTypeVersions
      2.0.1 / 1.1.1 / 1.1.0. Operations GetCapabilities, DescribeCoverage, GetCoverage. Formats
      image/tiff;application=geotiff, image/png, image/jpeg, application/gml+xml. NOTE: the
      capabilities document currently advertises ZERO wcs:CoverageSummary entries - the service
      is enabled but publishes no coverages.
  - id: ogc-wmts-1.0.0
    name: OGC Web Map Tile Service 1.0.0
    conforms: false
