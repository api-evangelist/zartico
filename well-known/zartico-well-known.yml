  platform.zartico.com each serve a complete OpenID Connect Discovery 1.0 document AND an
  RFC 8414 OAuth 2.0 Authorization Server Metadata document. Both are saved verbatim here.

  NO security.txt (RFC 9116) is published anywhere on the Zartico estate. No api-catalog
  (RFC 9727), no ai-plugin.json, no agent card on any host.

  SOFT-200 CAUTION. my.zartico.com, z5.zartico.com and event-pulse.zartico.com are single-page
  applications whose catch-all route answers HTTP 200 with an HTML shell for EVERY unknown path,
  including every /.well-known/* path, /openapi.json and /llms.txt. Those 200s are recorded below
  with real: false - they are the SPA shell, not documents, and a later round must not read them
  as hits. login.zartico.com and platform.zartico.com return Okta error 405 E0000022 on the
  paths they do not serve, which is an honest miss.
